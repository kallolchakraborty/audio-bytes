<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AudioBytes — Your music, beautifully organized.</title>
  <meta name="description" content="Modern music streaming experience. Discover playlists, search songs, and enjoy premium audio.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="AudioBytes">
  <meta name="theme-color" content="#E95420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AudioBytes">

  <meta property="og:title" content="AudioBytes — Your music, beautifully organized.">
  <meta property="og:description" content="Modern music streaming experience. Discover playlists, search songs, and enjoy premium audio.">
  <meta property="og:image" content="assets/images/og-image.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://audiobytes.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AudioBytes">
  <meta property="og:locale" content="en_US">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AudioBytes — Your music, beautifully organized.">
  <meta name="twitter:description" content="Modern music streaming experience.">
  <meta name="twitter:image" content="assets/images/og-image.svg">

  <link rel="canonical" href="https://audiobytes.app/">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=block" rel="stylesheet">

  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/main.css">

  <script defer src="https://www.youtube.com/iframe_api"></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "url": "https://audiobytes.app/",
    "name": "AudioBytes",
    "description": "Modern music streaming experience.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://audiobytes.app/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>
<body class="bg-[#0F1115] text-slate-200 font-sans antialiased min-h-screen flex flex-col">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-brand-500 focus:text-white focus:rounded-lg focus:text-sm focus:font-semibold focus:outline-none focus:ring-2 focus:ring-brand-500">Skip to main content</a>

  <div id="app" class="flex flex-col min-h-screen">
    <header id="app-header" class="sticky top-0 z-40 glass-nav transition-all duration-300" role="banner"></header>

    <div id="app-layout" class="flex flex-1 relative">
      <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation"></aside>
      <main id="main-content" class="flex-1 relative min-w-0" role="main">
        <div id="page-view" class="min-h-[calc(100vh-8rem)]"></div>
      </main>
    </div>

    <div id="player-bar" class="fixed bottom-0 left-0 right-0 z-50" role="region" aria-label="Music player"></div>
  </div>

  <div id="search-modal" class="hidden fixed inset-0 z-50" role="dialog" aria-modal="true" aria-label="Search"></div>
  <div id="youtube-player" class="hidden"></div>
  <div id="toast-container" class="fixed top-14 sm:top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none" aria-live="polite"></div>
  <div id="context-menu" class="hidden fixed z-50" role="menu"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
